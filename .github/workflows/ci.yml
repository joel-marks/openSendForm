name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite
          coverage: none
        env:
          XDEBUG_MODE: off

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run test suite
        run: composer test

  # Build the release zip and verify its contents on every PR/push. Runs the
  # real bin/build-release.php + bin/verify-release.php and uploads the zip as a
  # downloadable workflow artifact so a maintainer can grab it for a manual
  # GitHub Release (release automation is a later increment). PHP 8.1 only — the
  # minimum supported version — since the artefact is the same on any leg.
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history is not needed, but the build uses `git archive HEAD`, so
        # the single checked-out commit is enough.

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          # zip: the build/verify scripts use ZipArchive when it is available.
          extensions: pdo_sqlite, zip
          coverage: none
        env:
          XDEBUG_MODE: off

      - name: Build release zip
        run: php bin/build-release.php

      - name: Verify release zip
        run: php bin/verify-release.php

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: osf-php-release-zip
          path: dist/osf-php-v*.zip
          if-no-files-found: error
